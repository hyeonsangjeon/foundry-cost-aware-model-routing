# Control-plane capture of what is actually DEPLOYED on the tenant this rate
# card prices — the set that can bill us.
#
# WHY THIS FILE EXISTS: 03D-3 returned `gpt-5.6-terra` from a Model Router
# deployment, the card had no row for it, and 12 calls went unpriced. The first
# fix pinned the 5.6 family. Diffing the card against this capture then found
# five MORE deployments with no row at all — including `DeepSeek-V4-Pro`, where
# the card pinned V3.1/V3.2 while the deployed model was V4-Pro. Every one of
# those was found by hand. This file turns that diff into a test
# (`tests/test_deployed_set_coverage.py`), so "deployed but unpriced" fails in
# CI instead of surfacing in a paid run's traces.
#
# WHAT IT IS NOT: not an inventory of what the Model Router can serve. The
# router serves from its own managed roster, which is not enumerable before
# dispatch — `gpt-5.6-terra` was never deployed here and was served anyway. This
# capture is a LOWER BOUND on the billable model set. Passing the coverage test
# means no *deployed* model is unpriced; it can never mean the card is complete.
#
# HOW TO REFRESH (read-only, no inference, no cost):
#   az cognitiveservices account deployment list -n <account> -g <rg> \
#     --query "[].{name:name, model:properties.model.name,
#                  version:properties.model.version, sku:sku.name}" -o tsv
# then re-run the coverage test and pin any new row from its retail meter.
#
# No endpoint, key, or subscription id appears here — deployment and model names
# only.

source: az cognitiveservices account deployment list
account: aoai-foundry-iq-demo-ext
region: eastus
captured: "2026-08-15"

deployments:
  # --- OpenAI surface ---
  - deployment: model-router
    model: model-router
    version: "2025-11-18"
    sku: GlobalStandard
    kind: router
  - deployment: model-router-cost
    model: model-router
    version: "2025-11-18"
    sku: GlobalStandard
    kind: router
  - deployment: model-router-quality
    model: model-router
    version: "2025-11-18"
    sku: GlobalStandard
    kind: router
