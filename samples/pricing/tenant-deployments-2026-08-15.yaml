  # --- Embedding ---
  # Deployed and DELIBERATELY unpriced: eastus exposes only a DataZone meter for
  # it (the card excludes DZ), and an embedding model has no output tokens while
  # a rate row requires both `input` and `output`. It fails closed rather than
  # being fitted to a shape it does not have.
  - deployment: text-embedding-3-large
    model: text-embedding-3-large
    version: "1"
    sku: GlobalStandard
    kind: embedding
    unpriced_reason: >-
      no GlobalStandard meter in eastus (DataZone only) and no output-token
      dimension; cannot be represented as a v2 rate row
