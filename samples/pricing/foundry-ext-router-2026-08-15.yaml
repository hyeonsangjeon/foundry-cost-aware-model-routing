# Rate-card v2 — AUTHORITATIVE composite Model Router pricing for the
# `aoai-foundry-iq-demo-ext` tenant (BOLT-03B, rate-card v2 contract).
#
# SUPERSEDES `foundry-ext-router.yaml` (the 2026-08-05 capture), which is now
# FROZEN and must not be edited: `prereg-03d2-router-modes.md` and
# `prereg-03d3-router-modes.md` bind its exact sha256
# (ff6f5378e14d4e78fa50488c6e0dafa7564dbe0293dcc9e6ea9b4411946919c3) as
# `rate_card_hash`, and `_resolve_pricing` folds the card's full text into
# `plan_hash`. Editing that file in place would silently invalidate two sealed
# preregistrations. New runs point here; sealed runs keep replaying against the
# `pricing.snapshot.yaml` captured inside their own run directory.
#
# WHAT CHANGED, AND WHY IT IS A RE-CAPTURE RATHER THAN A PRICE UPDATE: no rate
# moved. The 2026-08-05 capture was INCOMPLETE — it enumerated the 27-model
# router candidate pool plus the direct arm, and missed two siblings of the
# deployed `gpt-5.6-sol`. Both were already in effect at that time
# (effectiveStartDate 2026-07-01), so this is a correction to the enumeration,
# not a change in the prices. All 61 meterIds pinned by the previous card were
# re-resolved against the live API on 2026-08-15 and every value matched (61/61,
# 0 mismatches) before this file was stamped with today's capture_date.
#
# Unlike the ILLUSTRATIVE sibling cards (rate-card-v2.example.yaml,
# foundry-ext-full.yaml), every rate below is pinned from a single authoritative
# source — the public Azure Retail Prices API — captured on 2026-08-15. No rate
# is guessed. Any candidate-pool model whose GlobalStandard on-demand meter is
# NOT exposed by that API is OMITTED from `rates` on purpose: 03B prices it
# `unpriced` and fails closed (see `applicability_notes`) rather than inventing a
# number. That is the whole point — 03Z retired the legacy card precisely because
# its markup and per-model rates could not be sourced.
#
# Meter discovery lesson (2026-08-05 re-audit): the Retail Prices API meter
# NAMING is inconsistent across products and does NOT contain the model-id token.
# Do NOT search by `contains(meterName,'gpt-5.6-sol')` — that returns 0 rows.
# Enumerate per product and map by hand, e.g.
#   $filter=serviceName eq 'Foundry Models'
#           and productName eq 'Azure OpenAI GPT5'
#           and armRegionName eq 'eastus'
# then read the tiered/lowercase meters ("5.6 sol ShortCo Inp Std Gl",
# "5.4 longco inp Gl") and the canonical ones ("GPT 5 Inpt Glbl 1M Tokens").
# The router markup lives under serviceName "Foundry Tools" / productName
# "Model Tools"; underlying models under serviceName "Foundry Models".
#
# Meter discovery lesson (2026-08-15 re-audit): scope the enumeration to the
# MODEL FAMILY, not to the candidate pool. The 2026-08-05 pass priced the one
# 5.6 model we had deployed (`gpt-5.6-sol`) and stopped there; `az
# cognitiveservices model list -l eastus` shows the family is actually three
# (`gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.6-luna`, all version 2026-07-09, all
# deployable, all with meters). Model Router then served `gpt-5.6-terra` in
# 03D-3 and the request went unpriced. Unlike the model-id lesson above,
# `contains(meterName,'5.6 terra')` DOES work for this product — the GPT5
# meters carry the family token.
#
# Meter discovery lesson (2026-08-15, second pass): the family scope was STILL
# too narrow. Diffing this card against `az cognitiveservices account deployment
# list` — the set that can actually bill us — found six more deployments with no
# row here at all: DeepSeek-V4-Pro, Kimi-K2.6, Mistral-Large-3,
# Cohere-command-a-plus-05-2026, Phi-4-reasoning, text-embedding-3-large. Note
# `DeepSeek-V4-Pro`: this card pinned V3.1 and V3.2, but the model actually
# DEPLOYED is V4-Pro, which no version of the card has ever priced. The right
# enumeration scope is therefore the DEPLOYED SET, and it is now checked
# mechanically (`tests/test_deployed_set_coverage.py`) against a committed
# control-plane capture rather than rediscovered by reading traces.
#
# Unit basis differs by product: "Azure OpenAI" / "Azure OpenAI Reasoning" /
# "Azure Deepseek Models" / "Azure Grok Models" / "Azure Llama Models" /
# "Azure OpenAI OSS Models" meters are per-1K tokens (converted to per-1M, x1000);
# "Azure OpenAI GPT5" meters are already published per-"1M Tokens" (x1).
#
# Composite formula (the ONLY pricing path in 03B):
#   router request cost = router input-token markup
#                       + underlying input + output (+ pinned cached/reasoning)
# Direct-model arms omit the markup.

schema_version: 2
currency: USD
unit_basis: per_1m_tokens
source: >-
  Azure Retail Prices API (https://prices.azure.com/api/retail/prices,
  api-version 2023-01-01-preview), captured 2026-08-15, region eastus,
  GlobalStandard on-demand. Router input markup: meter "Model Routers GL 1M
  Tokens" (serviceName "Foundry Tools" / productName "Model Tools"), unit 1M,
  meterId 615a7bc2-fa4e-5b2c-b198-40a04e5a8611 (eastus2 representative; the GL
  price is region-uniform at USD 0.14 — there is no eastus-specific meter row).
  Underlying-model rates: serviceName "Foundry Models" across products "Azure
  OpenAI", "Azure OpenAI GPT5", "Azure OpenAI Reasoning", "Azure OpenAI OSS
  Models", "Azure Llama Models", "Azure Grok Models", "Azure Deepseek Models",
  "Azure Kimi", "Azure Mistral Models", "Cohere Models", "Azure Phi Models".
  Exact meterName / meterId / effectiveStartDate per rate row are in the comments
  beside each row below.
effective_date: "2026-08-15"
capture_date: "2026-08-15"
region: eastus
sku_meter_basis: >-
  GlobalStandard on-demand, per 1,000,000 tokens by token kind. Std (standard)
  priority is used where a Std/PP (Priority Processing) split exists; Batch,
  DataZone (DZ), regional, fine-tuning (-ft), and provisioned (PTU) meters are
  excluded. Azure prices the gpt-4o family uniformly across its dated snapshots,
  so gpt-4o-0806 / gpt-4o-mini-0718 are authoritative for the deployed
  2024-11-20 / 2024-07-18 snapshots. Individual meter effectiveStartDates span
  2024-07 to 2026-07; the card is a single 2026-08-15 snapshot.
applicability_notes: >-
  COUNT: 22 of the 27 router candidate-pool models are priced here; 5 are
  unpriced (omitted from `rates`, fail-closed): claude-haiku-4-5,
  claude-sonnet-4-5, claude-opus-4-1, claude-opus-4-6, claude-opus-4-7 —
  Anthropic models are not sold through Azure and appear in NO Foundry Models
  product in the Retail Prices API (0 rows for "Claude"/"Anthropic" in eastus).
  Pin them from another authoritative source if the pool must price them.
  THE POOL DOES NOT BOUND WHAT THE ROUTER SERVES — this is measured, not
  assumed: in the 03D-3 live run the balanced `model-router` deployment returned
  `gpt-5.6-terra` on 12 of its 72 calls, a model that is in NO version of the
  27-model candidate pool and was never deployed on this account. The previous
  card had no row for it, so `pricing_key` resolved to null and all 12 calls
  went unpriced (fail-closed), leaving that arm cost-incomplete. The whole 5.6
  family is therefore pinned here — sol, terra and luna — even though only sol
  is deployed. Treat the pool as a lower bound on the billable model set, never
  as its definition.
  DEPLOYED SET: the pool is not the scope; what can bill us is. Every
  chat-completion deployment on this account is priced here, including the five
  that live on the Foundry inference surface rather than the OpenAI one
  (DeepSeek-V4-Pro, Kimi-K2.6, Mistral-Large-3, Cohere-command-a-plus-05-2026,
  Phi-4-reasoning). None of them is a router candidate and none was measured in
  03D, but an arm pointed at any of them would have failed closed exactly as
  gpt-5.6-terra did. ONE DEPLOYED MODEL IS DELIBERATELY LEFT UNPRICED:
  text-embedding-3-large cannot be represented honestly here — eastus exposes
  only a DataZone meter for it (no GlobalStandard row, and this card excludes
  DZ), and an embedding model has no output tokens while a rate row requires
  both `input` and `output`. It stays unpriced and fails closed rather than
  being fitted to a shape it does not have.
  Separately, the DIRECT-PREMIUM arm gpt-5.6-sol (NOT one of the 27 pool models)
  IS priced here from product "Azure OpenAI GPT5". The Model Router input-token
  markup (USD 0.14 / 1M input tokens) is charged on the request input tokens IN
  ADDITION to the resolved underlying model charges; direct-model arms
  (gpt-5.6-sol) omit it. A null cached/reasoning rate is an EXPLICIT
  "unsupported" marker: if such tokens appear at pricing time the request fails
  closed (unpriced), never silently discounted. reasoning is pinned to the
  model's output rate for reasoning-capable backends (o4-mini, gpt-oss-120b,
  grok-4, grok-4-1-fast, gpt-5, gpt-5-mini, gpt-5-nano, gpt-5.2, gpt-5.4,
  gpt-5.4-mini, gpt-5.4-nano, gpt-5.5, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna,
  DeepSeek-V3.1, DeepSeek-V3.2, DeepSeek-V4-Pro, Kimi-K2.6, Phi-4-reasoning)
  because Azure bills reasoning tokens at the output rate; it is null for
  non-reasoning backends (gpt-4o, gpt-4o-mini, gpt-4.1, gpt-4.1-mini,
  gpt-4.1-nano, gpt-5.2-chat, gpt-5.3-chat, Llama-4-Maverick, Mistral-Large-3,
  Cohere-command-a-plus-05-2026). cached is pinned
  ONLY where a base GlobalStandard cached meter is exposed; for gpt-4o /
  gpt-4o-mini / gpt-oss-120b / Llama-4-Maverick / grok-4 / grok-4-1-fast /
  DeepSeek-V3.1 / DeepSeek-V3.2 / Mistral-Large-3 /
  Cohere-command-a-plus-05-2026 / Phi-4-reasoning the API exposes no base GL
  cached meter in this snapshot, so cached is null and those requests fail
  closed if cached tokens appear. CONTEXT TIERS: gpt-5.4, gpt-5.5, and the whole 5.6 family (sol, terra,
  luna) are context-tiered
  (short vs long context; the retail meters split ShortCo/LongCo, long ~= 2x
  short). RateCardV2 pins ONE rate per pricing_key and the resolver cannot know
  the tier (it depends on request/context length, and the provider returns NO
  tier label in its `model` field), so the card stores the LONG-context
  (expensive) tier: reservations therefore never under-reserve, and a request
  that is actually short-context over-charges in the fail-safe direction. The
  short-context rates are recorded in the comment beside each tiered row. The
  short/long token boundary is NOT authoritatively sourced — the retail meters
  give only ShortCo/LongCo with no token number, and third-party aggregators
  disagree (~128k-272k); tier-aware settlement (charging the short rate and
  returning headroom) is deferred future code work in `composite_cost`, not a
  data change. GROK mapping: the catalog exposes Grok 4 as grok-4-20-reasoning /
  grok-4-20-non-reasoning (aliased to pricing_key `grok-4`) and the fast tier as
  grok-4-1-fast-reasoning / grok-4-1-fast-non-reasoning (aliased to
  `grok-4-1-fast`); "Grok4 Fast" and "Grok 4.1" meters independently agree at
  0.20/0.50.

