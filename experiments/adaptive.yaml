# adaptive.yaml — raise the fan-out threshold to avoid unnecessary calls.
#
# Experiment 05 (ensemble) fans out on *every* high-value task and pays the
# extra candidate-call cost: ~$0.50 spent to keep ~$0.13 of winners (3.7x).
# This experiment runs the same workload, signals, policy, and pricing, but turns the fan-out
# path off by raising the spending limit's `compare_min_value` above every task's
# value, so the router takes a single ordered route on each task instead of
# fanning out.
#
# The result: pass rate (100%) and savings (~47% under the premium-on-every-task
# baseline) are identical to the ensemble run, but the extra candidate-call
# cost falls to ~$0.00. On this deterministic offline projection, fan-out finds the same
# cheapest-passing winner that ordered escalation already reaches — so it is
# unnecessary for this workload. Raising the threshold removes those calls with
# no loss in pass rate or savings. See lab-notebook/06 for the full threshold
# sweep. Best-of-N can lift *quality* in a real system, which this projection
# does not model, so measure that lift before paying for the extra calls.
#
# Everything is offline and deterministic. Every number is a projection over
# synthetic data (labels.measured = false), not a measured saving.

name: adaptive
title: "팬아웃 임계값 — 추가 후보 호출 없이 절감률 유지"
summary: >-
  실험 05와 같은 워크로드, 신호, 정책, 요율을 사용합니다. compare_min_value를
  모든 태스크 가치보다 높게 설정해 팬아웃을 끕니다. 이 결정론적 오프라인
  투영에서는 통과율 100%와 프리미엄 기준선 대비 약 47% 절감이 유지되고,
  추가 후보 호출 비용은 약 $0.00이 됩니다. 실제 시스템의 best-of-N 품질 향상은
  이 실험에서 측정하지 않았습니다.

dataset:
  workload: samples/telemetry/mixed-coding-workload.sample.jsonl
  signals: samples/responses/ensemble-fanout-signals.sample.json
  synth: false

policy: null           # null → bundled seed policy (src/policy/seed_policy.yaml)
pricing: null          # null → bundled illustrative pricing (measured=false)

# The fan-out threshold. compare_min_value=1.1 sits above every task's value
# (max is 1.0), so the router never fans out → single ordered route on each task.
budget:
  compare_min_value: 1.1
  min_compare_candidates: 2

# Highlight the same task the ensemble run does; here it routes single-route.
spotlight: auto

# Reproducibility contract (offline projection over synthetic data).
expect:
  min_coverage: 1.0     # single-route escalation still covers every task
  min_delta_pct: 0.40   # …at the SAME savings as the ensemble run
  min_tasks: 6
  max_tax_ratio: 0.01   # …with essentially no extra candidate-call cost
