# ensemble.yaml — call every candidate and account for every call.
#
# A curated set of high-value tasks that all route in *compare* (fan-out) mode:
# the router runs every candidate and keeps the best result. Because several
# models pass the offline checks on each task, best-of-N keeps the cheapest
# passing model. Routing therefore costs 47% less than the
# premium-on-every-task baseline while retaining a 100% pass rate.
#
# The experiment measures the **extra candidate-call cost** of fan-out. Every
# candidate call is billed, including calls whose outputs are discarded. Here
# the winners cost ~$0.13, but fan-out spends ~$0.50 (3.7x) to run all 20
# candidate calls. An "ensemble everything" strategy pays that extra cost on
# every task. Cost-aware routing fans out only where the task value justifies it
# (see the `all_ensemble` vs `mix` strategy arms and the `fanout` metrics).
#
# Everything is offline and deterministic. Every number is a projection over
# synthetic data (labels.measured = false), not a measured saving.

name: ensemble
title: "팬아웃 — 모든 후보를 호출할 때 드는 추가 비용"
summary: >-
  가치가 높은 태스크마다 모든 후보 모델을 병렬 호출하고, 오프라인 검사를 통과한
  후보 중 비용이 가장 낮은 결과를 남깁니다. 통과율은 100%이고 비용은
  프리미엄 기준선보다 약 47% 낮지만, 선택하지 않은 후보의 호출까지 합치면
  승자 비용의 3.7배를 지불합니다. 이 값은 합성 데이터로 계산한 오프라인 투영입니다.

dataset:
  workload: samples/telemetry/mixed-coding-workload.sample.jsonl
  signals: samples/responses/ensemble-fanout-signals.sample.json
  synth: false

policy: null           # null → bundled seed policy (src/policy/seed_policy.yaml)
pricing: null          # null → bundled illustrative pricing (measured=false)

# Highlight one fan-out task where keeping the cheapest passing model beats the
# naive premium arm by the widest margin.
spotlight: auto

# Reproducibility floor (offline projection over synthetic data).
expect:
  min_coverage: 1.0    # best-of-N always finds a passing model
  min_delta_pct: 0.40  # …while landing well under the premium-on-every-task arm
  min_tasks: 6
