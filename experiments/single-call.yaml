# single-call.yaml — choose once up front versus escalate after a failed check.
#
# Single-call routing — picking one model per prompt, up front, with no fan-out
# and no escalation — is exactly what Azure AI Foundry's Model Router already
# does well. This experiment is *not* a replacement for it: it projects that
# single-call shape as a transparent `single_call` strategy arm (a difficulty-
# tiered single pick over the same synthetic 100-task workload) and compares it
# on one frontier with this repo's observe-then-escalate mix.
#
# This configuration records that the escalating strategy has a materially
# higher pass rate than the single-call arm at comparable cost because it can observe
# each check and only pay more on an observed failure. That escalation layer is
# the complement any single-call router (the built-in Model Router included) can
# sit under. Experiment 09 wires the *real* Model Router in as this arm and
# proves it measured=true. Here everything is offline and deterministic; every
# number is labels.measured = false.

name: single-call
title: "모델을 한 번 선택하기 vs 실패 뒤 상위 모델 재시도"
summary: >-
  프롬프트를 보내기 전에 모델 하나를 선택하는 단일 호출 방식을 합성 데이터로
  투영하고, 검사 실패를 확인한 뒤 상위 모델을 다시 호출하는 방식과 비교합니다.
  이 워크로드에서 단일 호출 방식의 통과율은 52%, 에스컬레이션 방식의 통과율은
  100%입니다. 실제 제품 라우터의 품질을 측정한 결과는 아닙니다.

dataset:
  workload: samples/telemetry/mixed-coding-workload.sample.jsonl
  signals: null        # null + synth:true → deterministic offline signals
  synth: true

policy: null           # null → bundled seed policy (src/policy/seed_policy.yaml)
pricing: null          # null → bundled illustrative pricing (measured=false)

spotlight: auto

# Reproducibility floor (offline projection over synthetic data).
# min_escalation_gain pins the thesis: mix coverage minus the single_call
# arm coverage must stay at least this large (actual ~0.48).
expect:
  min_coverage: 1.0          # the escalating mix must keep full coverage
  min_delta_pct: 0.20        # …while cutting at least 20% of the naive bill
  min_tasks: 100
  min_escalation_gain: 0.30  # escalation must gain at least 30 percentage points
