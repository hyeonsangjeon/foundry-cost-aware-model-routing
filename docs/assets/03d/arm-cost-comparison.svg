<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Per-arm total cost bar chart. router-cost $0.06 versus direct-premium $1.34; each bar annotated with task pass-rate and cost-per-pass.">
  <rect x="0" y="0" width="760" height="360" fill="#ffffff"/>
