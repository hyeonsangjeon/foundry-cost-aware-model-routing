<text x="140" y="168.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600">router-balanced</text>
<text x="140" y="182.0" font-size="10" fill="#7b8794" text-anchor="end">(Balanced)</text>
  <rect x="150" y="144" width="92" height="40" rx="4" fill="#5b7089"/>
<text x="252" y="162.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="700">$0.31</text>
<text x="252" y="178.0" font-size="10" fill="#52606d" text-anchor="start">pass 95.8% (23/24) · $/pass $0.0133</text>
<text x="140" y="234.0" font-size="12" fill="#1f2933" text-anchor="end" font-weight="600">direct-premium</text>
<text x="140" y="248.0" font-size="10" fill="#7b8794" text-anchor="end">(—)</text>
  <rect x="150" y="210" width="404" height="40" rx="4" fill="#e8683f"/>
<text x="564" y="228.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="700">$1.34</text>
