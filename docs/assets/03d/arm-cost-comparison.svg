<text x="630" y="294.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="700">$1.56</text>
<text x="630" y="310.0" font-size="10" fill="#52606d" text-anchor="start">pass 95.8% (23/24) · $/pass $0.0678</text>
<text x="24" y="336" font-size="11" fill="#52606d" text-anchor="start">핵심 대비: router-cost는 direct-premium 대비 95.2% 저렴(풀정밀도), 품질 격차 4.17%p 이내.</text>
