<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Grok 슬라이스만 놓고 본 Cost 모드와 Balanced 모드</title>
  <desc id="chart-desc">0에서 100퍼센트까지의 묶음 막대 그래프입니다. 실험 11(무효)은 Cost 모드 93.11퍼센트, Balanced 모드 99.41퍼센트입니다. 실험 12는 Cost 모드 96.47퍼센트, Balanced 모드 99.10퍼센트입니다. 백엔드를 고정하면 두 런 모두에서 요청을 여러 백엔드로 나눠 보낸 Balanced 모드가 더 높게 기록됐습니다. 실험 13의 Balanced 모드에는 Grok 행이 없었습니다.</desc>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="24.0" y="34.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="700">백엔드를 고정하면 요청을 나눠 보낸 쪽이 더 낮지 않습니다</text>
  <text x="24.0" y="56.0" font-size="11" fill="#7b8794" text-anchor="start">Grok 행만 · sum(cached) / sum(input) · gpt 계열 행은 정의상 들어오지 않습니다(§3-3)</text>
