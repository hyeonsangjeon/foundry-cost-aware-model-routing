<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="chart-title chart-desc">
  <title id="chart-title">Cost mode versus Balanced mode on the Grok slice only</title>
  <desc id="chart-desc">Grouped bar chart from 0 to 100 percent. Experiment 11 (VOID): Cost mode 93.11 percent, Balanced mode 99.41 percent. Experiment 12: Cost mode 96.47 percent, Balanced mode 99.10 percent. In both runs Balanced mode, the arm that spread its requests across backends, recorded the higher ratio once the backend is held fixed. Experiment 13 recorded no Grok rows in Balanced mode.</desc>
