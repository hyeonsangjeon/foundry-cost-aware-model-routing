  <title id="chart-title">봉인된 세 런의 회차별 캐시 기록 비율, Cost 모드</title>
  <desc id="chart-desc">런마다 한 묶음, 회차마다 한 막대인 묶음 막대 그래프이고 세로축은 0에서 100퍼센트입니다. 실험 11(무효)은 83.64, 95.67, 100.00입니다. 실험 12는 89.61, 100.00, 100.00입니다. 실험 13은 90.79, 100.00, 100.00입니다. 세 런이 같은 모양으로 올라가고 되돌아 내려간 런은 없습니다. 1회차는 콜드 기준선이 아닙니다.</desc>
