name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

# One in-flight run per ref; newer pushes cancel stale ones. Keying on the PR
# number (when present) collapses the push+pull_request pair for a branch that
# has an open PR into a single active run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Validation gate (incl. redaction scan)
        run: bash scripts/validate-local.sh

      - name: Tests
        run: |
          set +e
          pytest
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "pytest: no tests collected"
            rc=0
          fi
          exit $rc

      - name: Sample replay (if present)
        run: |
          if [ -f samples/python/replay_route.py ]; then
            python samples/python/replay_route.py samples/telemetry/mixed-coding-workload.sample.jsonl
            python samples/python/replay_route.py samples/telemetry/mixed-coding-workload.sample.jsonl --synth
          else
            echo "sample replay not present"
          fi

      - name: CLI smoke (cost-router)
        run: |
          if command -v cost-router >/dev/null 2>&1; then
            cost-router --version
            cost-router replay --synth
            cost-router evals --synth
            cost-router serve --help
          else
            echo "cost-router console script not installed"
          fi

      - name: Policy ops smoke
        run: |
          if command -v cost-router >/dev/null 2>&1; then
            cost-router policy --help
            cost-router policy validate --policy src/policy/seed_policy.yaml
            cost-router policy validate --policy samples/policy/candidate.example.yaml
            cost-router policy simulate --policy samples/policy/candidate.example.yaml --synth
            cost-router policy regression --candidate samples/policy/candidate.example.yaml --synth
            cost-router replay --policy samples/policy/candidate.example.yaml --synth
          else
            echo "cost-router console script not installed"
          fi

      - name: Experiment reproducibility contract
        run: |
          if command -v cost-router >/dev/null 2>&1; then
            cost-router experiment list
            cost-router experiment run curated
            cost-router experiment run ensemble
            cost-router experiment run adaptive
            cost-router experiment run limits
            cost-router experiment run model-router
            cost-router hero
          else
            echo "cost-router console script not installed"
          fi

      - name: Service smoke (offline endpoints)
        run: |
          python - <<'PY'
          import json
          from router.server import RouterService

          svc = RouterService()
          assert svc.dispatch("GET", "/healthz").status == 200
          assert svc.dispatch("GET", "/policy").status == 200
          task = {"task_id": "t-0001", "class": "generate",
                  "tokens": {"input": 1232, "cached": 448, "output": 418, "reasoning": 168}}
          resp = svc.dispatch("POST", "/route", json.dumps({"task": task, "synth": True}).encode())
          assert resp.status == 200 and resp.payload["trace"]["chosen"], resp.payload
          print("service smoke ok:", resp.payload["trace"]["chosen"])
          PY

      - name: Docker build (optional)
        run: |
          if command -v docker >/dev/null 2>&1; then
            docker build -t cost-router:ci .
          else
            echo "docker not available on runner; skipping image build"
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install docs toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          pip install -e .

      - name: Terminology gate (통과율 vs 채점 커버리지)
        run: python scripts/check_terminology.py

      - name: Build docs (strict)
        run: mkdocs build --strict

      - name: Build interactive dashboard demos (en at /demo/, ko at /ko/demo/)
        run: |
          python scripts/build_static_site.py site/demo en
          python scripts/build_static_site.py site/ko/demo ko

      - name: Re-localize root 404 to English (default locale)
        run: python scripts/localize_root_404.py site

      - name: i18n site contract (en at root, ko under /ko/, pairs/redirects/hreflang/demos)
        run: python scripts/check_i18n_site.py site

  onboarding:
    # BOLT-03E: the fresh-clone journey is a hard gate, offline only. It bootstraps
    # a clean venv with just the declared deps, proves the reproduction PASSes
    # within budget, and confirms the served success screen + accessible Star CTA.
    # No real Azure call and no GitHub Star mutation ever happen here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Track A — fresh-clone bootstrap + headless verify (offline)
        # Detects 3.11, builds .venv with only declared deps, runs
        # `cost-router hero --json` (<=30s), boots the dashboard, discovers the
        # actual bound port, waits for readiness (<=10s), verifies PASS + the
        # accessible CTA (<=30s), then tears the process tree down. `--json`
        # records clone/venv/pip/install telemetry with platform metadata.
        run: python scripts/quickstart.py --ci --json

      - name: Offline acceptance harness (verify_onboarding)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python scripts/verify_onboarding.py --offline

      - name: Fake-Foundry E2E — doctor -> plan -> approval -> run -> replay
        # Track B wiring exercised entirely with fake clients / stub HTTP — the
        # 12 cockpit scenarios (auth fail, 429 retry, provider terminal, grader
        # fail, stale plan, budget refusal, unpriced, replay tamper, abort races)
        # plus doctor pre-flight and measured-replay. Zero Azure.
        run: pytest -q tests/test_doctor.py tests/test_cockpit.py tests/test_measured_ledger.py

      - name: Guard — no real Azure call and no Star mutation in onboarding
        # Belt-and-suspenders: the onboarding scripts must never reach an Azure
        # data-plane host or a GitHub Star API; the repo URL may appear only as a
        # user-clickable CTA link.
        run: |
          if grep -RnE "cognitiveservices\.azure\.com|openai\.azure\.com|/user/starred|PUT .*/starred" \
              scripts/quickstart.py scripts/verify_onboarding.py src/router/onboarding.py; then
            echo "onboarding must not contact Azure or the Star API" >&2
            exit 1
          fi
          echo "onboarding is offline and star-neutral"

