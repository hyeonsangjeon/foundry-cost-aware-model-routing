[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-cost-router"
version = "0.1.0"
description = "Model-routing experiment scaffold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hyeonsang Jeon" }]
keywords = ["model-routing", "llmops"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]
foundry = [
    # openai>=1.75.0 is the floor for the documented Azure OpenAI Chat
    # Completions sample this runner targets (BOLT-03B). The runner disables
    # SDK-level retries and wires explicit connect/read/write/pool timeouts, so
    # a floor that supports `max_retries=` and an `httpx.Timeout` is required.
    "openai>=1.75.0",
    "azure-identity>=1.15",
    # SCOPED OUT (BOLT-03B): azure-ai-inference is a beta SDK documented for
    # retirement on 2026-08-26. It backs only the opt-in partner surface
    # (provider=foundry), which is code-enforced out of benchmark/publishable
    # paths (see router.foundry_live.assert_provider_benchmark_safe). Kept as an
    # optional extra for wiring smokes; migrate before it can carry a measured
    # cost claim.
    "azure-ai-inference>=1.0",
]

[project.scripts]
cost-router = "router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policy = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "samples", "evals", "tests"]
# Benchmark fixtures emulate arbitrary model submissions (including deliberately
# buggy ones); they are graded by the harness, not linted as library code.
extend-exclude = ["benchmarks/original-coding/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS/JS template: line-length is not meaningful for markup.
"src/router/dashboard.py" = ["E501"]
# Per-locale string catalog: byte-exact en/ko prose, line-length not meaningful.
"src/router/demo_i18n.py" = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
